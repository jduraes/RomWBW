set cpu z80
set cpu noaltairrom
set n8vem enabled

; Console over telnet for scripted driving
set console telnet=2323

; Configure Serial Port (Basic polled 16550 UART)
set sio tty
set sio port=68/0/00/00/00/F/00/T
set sio port=6D/0/01/00/20/F/00/F

; image file for ROM and RAM
echo ROM Image: '%1'
attach n8vem0 %1

; hard disks
attach hdsk0 ..\\..\\Binary\\hd1k_combo.img
set hdsk0 format=HDSK
set hdsk0 geom=T:8192/N:256/S:512
set hdsk0 wrtenb

; enable timer interrupt, 50Hz
d timd 20
d timh 38
set simh timeron

; start emulation
echo
go
